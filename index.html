<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Raj — Sandbox Walki</title>
<link rel="stylesheet" href="style.css?v=13">
</head>
<body>
  <h1>Sandbox Walki — K6 + K20 + Siatka</h1>

  <div class="resource-bar" id="resource-bar"></div>

  <section class="main-menu-screen" id="main-menu-screen">
    <h2>Raj</h2>
    <p class="main-menu-subtitle">Sandbox Walki — K6 + K20 + Siatka</p>
    <div class="main-menu-buttons">
      <button id="new-game-btn" type="button">Nowa gra</button>
      <button id="resume-btn" type="button">Wznów</button>
      <button id="load-game-btn" type="button">Wczytaj grę</button>
      <button id="settings-btn" type="button">Ustawienia</button>
      <button id="exit-game-btn" type="button">Wyjdź z gry</button>
    </div>
    <p class="main-menu-save-info" id="main-menu-save-info"></p>
  </section>

  <section class="character-creation-screen hidden" id="character-creation-screen">
    <h2>Stwórz postać</h2>

    <div class="creation-row">
      <label class="creation-label" for="creation-name-input">Imię</label>
      <input type="text" id="creation-name-input" maxlength="24" placeholder="Wpisz imię postaci">
    </div>

    <div class="creation-row">
      <span class="creation-label">Płeć</span>
      <div class="gender-buttons">
        <button type="button" class="gender-btn" data-gender="Mężczyzna">♂ Mężczyzna</button>
        <button type="button" class="gender-btn" data-gender="Kobieta">♀ Kobieta</button>
      </div>
    </div>

    <div class="creation-class-area">
      <div class="class-wheel" id="creation-class-wheel"></div>
      <div class="class-wheel-center" id="creation-wheel-center"></div>
    </div>
    <div class="subclass-row" id="creation-subclass-row"></div>

    <div class="creation-description" id="creation-description"></div>

    <div class="creation-stats" id="creation-stats"></div>

    <button type="button" id="creation-confirm-btn" class="creation-confirm-btn" disabled>Rozpocznij grę</button>
  </section>

  <section class="location-screen hidden" id="location-screen">
    <h2>Wybierz cel wyprawy</h2>
    <div class="location-grid" id="location-grid"></div>
  </section>

  <div class="hidden" id="game-screen">
    <div class="current-location-banner" id="current-location-banner"></div>

    <div class="arena">
      <section class="panel player-panel collapsible" id="player-panel">
        <h2>Gracz <button class="collapse-toggle" type="button">▾</button></h2>
        <div class="fighter collapsible-content" id="player-fighter"></div>
      </section>

      <section class="map-panel">
        <div class="map-stage">
          <svg id="battle-map"></svg>
          <div id="fx-layer"></div>
        </div>
        <div class="map-legend">
          <span class="legend-item"><span class="legend-swatch swatch-obstacle"></span>Przeszkoda (osłona)</span>
          <span class="legend-item"><span class="legend-swatch swatch-reachable"></span>Osiągalne ruchem</span>
          <span class="legend-item"><span class="legend-swatch swatch-deploy"></span>Strefa rozstawienia</span>
          <span class="legend-item"><span class="legend-swatch swatch-player"></span>Ty</span>
          <span class="legend-item"><span class="legend-swatch swatch-enemy"></span>Przeciwnik</span>
        </div>
      </section>

      <section class="panel enemies-panel collapsible">
        <h2>Przeciwnicy <button class="collapse-toggle" type="button">▾</button></h2>
        <div class="collapsible-content" id="enemies-list"></div>
      </section>
    </div>

    <div class="controls">
      <button id="start-battle-btn">Rozpocznij walkę</button>
      <button id="attack-btn">Atakuj wybrany cel</button>
      <button id="end-turn-btn">Zakończ turę</button>
      <button id="reset-btn">Nowa walka</button>
      <button id="change-location-btn" type="button">🗺️ Zmień lokację</button>
      <button id="main-menu-btn" type="button">🏠 Menu główne</button>
      <button id="mute-btn" type="button">🔊 Dźwięk</button>
      <button id="codex-btn" type="button">📜 Kodeks świata</button>
    </div>

    <section class="log-panel collapsible">
      <h2>Log walki <button class="collapse-toggle" type="button">▾</button></h2>
      <div class="collapsible-content" id="combat-log"></div>
    </section>
  </div>

  <div class="codex-overlay hidden" id="codex-overlay">
    <div class="codex-modal">
      <div class="codex-header">
        <div class="codex-tabs" id="codex-tabs"></div>
        <button class="codex-close" id="codex-close" type="button">✕</button>
      </div>
      <div class="codex-body" id="codex-body"></div>
    </div>
  </div>

  <div class="codex-overlay hidden" id="settings-overlay">
    <div class="codex-modal">
      <div class="codex-header">
        <div class="codex-tabs"><span class="modal-title">Ustawienia</span></div>
        <button class="codex-close" id="settings-close" type="button">✕</button>
      </div>
      <div class="codex-body">
        <div class="settings-row">
          <span>Dźwięk</span>
          <button id="settings-mute-btn" type="button">🔊 Dźwięk</button>
        </div>
        <div class="settings-row">
          <span>Cały postęp (zasoby, zapisana gra)</span>
          <button id="clear-progress-btn" type="button" class="danger-btn">Wyczyść cały postęp</button>
        </div>
      </div>
    </div>
  </div>

  <div class="codex-overlay hidden" id="load-game-overlay">
    <div class="codex-modal">
      <div class="codex-header">
        <div class="codex-tabs"><span class="modal-title">Wczytaj grę</span></div>
        <button class="codex-close" id="load-game-close" type="button">✕</button>
      </div>
      <div class="codex-body">
        <p id="load-game-summary"></p>
        <button id="load-game-confirm-btn" type="button">Wczytaj</button>
      </div>
    </div>
  </div>

  <script src="js/audio.js?v=13"></script>
  <script src="js/dice.js?v=13"></script>
  <script src="js/grid.js?v=13"></script>
  <script src="js/classes.js?v=13"></script>
  <script src="js/lore.js?v=13"></script>
  <script src="js/locations.js?v=13"></script>
  <script src="js/characters.js?v=13"></script>
  <script src="js/combat.js?v=13"></script>
  <script src="js/ui.js?v=13"></script>
  <script src="js/main.js?v=13"></script>
</body>
</html>
